name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy in progress finishes, the next waits
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The draw.io submodule is checked out without its history
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 1
      - name: Assemble the site
        run: |
          mkdir -p _site/drawio/src/main
          cp -R index.html css img js data _site/
          cp -R drawio/src/main/webapp _site/drawio/src/main/webapp
          rm -rf _site/drawio/src/main/webapp/WEB-INF
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
